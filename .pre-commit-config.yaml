# HRMA pre-commit hooks — the FAST checks only.
#
# Deliberate scope: everything here must finish in seconds on the staged files.
# The real evidence is the test suite (~15-20 min, see CONTRIBUTING.md §2) and
# the release gate (packaging/release_gate.sh). A pre-commit hook that takes
# minutes gets disabled by the first person in a hurry, and a disabled gate is
# worse than no gate because it still looks like protection.
#
# Install:
#   python3 -m pip install pre-commit
#   pre-commit install
#   pre-commit run --all-files      # first pass over the existing tree

repos:
  # ---------------------------------------------------------------------
  # File hygiene. These catch the mistakes that are invisible in a diff.
  # ---------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks

      # changelog.json and the experiment database are read by code and by the
      # release gate; a broken one fails at runtime, not at commit time.
      - id: check-json

      # A malformed workflow file silently stops running: GitHub shows no run
      # at all, and "no CI run for this commit" is exactly the state the
      # release gate refuses to publish from.
      - id: check-yaml

      - id: check-toml

      # Build outputs are measured in gigabytes and are gitignored; this is the
      # backstop for `git add -f`.
      #
      # SCOPE (measured 2026-09-01, not assumed): without --enforce-all this
      # hook only looks at files ADDED by the commit being made. Files already
      # tracked are out of scope, so `pre-commit run --all-files` reports
      # "Passed" on this tree even though two evidence dumps under
      # docs/scofield/raw/OH/D15/fea-viz/a3/ are ~24 MB each, i.e. above the
      # ceiling. That is not a false negative: the ceiling's job is to stop the
      # NEXT oversized file, and at 10 MB it still does that.
      #
      # Do NOT raise the ceiling to "match" those two files. Raising it would
      # not fix any red run (there is none) and would open the door for future
      # multi-megabyte additions. If the tracked tree itself must be enforced,
      # add --enforce-all AND first bring those files under the ceiling —
      # tests/test_faz4_yayin_kapisi.py::test_pre_commit_yapilandirmasi_calisir
      # locks both halves of that rule.
      - id: check-added-large-files
        args: [--maxkb=10240]

      # Detects an accidentally committed private key.
      - id: detect-private-key

      - id: check-ast          # the file at least parses as Python

  # ---------------------------------------------------------------------
  # flake8, restricted to the errors that are always real defects.
  #
  # The style rules (E501 line length, F401 unused import, ...) are NOT
  # enabled: the tree has 283 long lines and 241 unused-import/variable hits,
  # so turning them on would mean either a giant unrelated reformat commit or
  # a hook everyone learns to skip. What is enabled is the set that means the
  # code is broken:
  #   E9   syntax errors / IndentationError
  #   F63  comparison and membership-test bugs (e.g. `is` on a literal)
  #   F7   syntax-adjacent statement errors (break outside loop, ...)
  #   F82  undefined name  <-- a guaranteed NameError at runtime
  # ---------------------------------------------------------------------
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        # Tırnak ZORUNLU: YAML akış dizisi virgülden bölüyor, tırnaksız
        # yazıldığında --select=E9 / F63 / F7 / F82 beş ayrı argüman oluyor.
        args: ["--select=E9,F63,F7,F82", "--show-source"]

  # ---------------------------------------------------------------------
  # Project-specific: the claim/standard-citation lint.
  #
  # Faz 4 audit measured it: of the three standard titles checked by hand, all
  # three were wrong, and the PDF/UI printed verdicts ("NASA-grade accurate")
  # that no code path earns. tools/iddia_lint.py scans the source tree against
  # the registry in docs/STANDART_ATIFLARI.md and exits 1 on an unregistered
  # hit.
  #
  # Faz 5 / H5-5 (2026-08-03): the scan used to cover only hrma/ and only
  # .py/.js/.html, so README, the user manual and the release notes were never
  # checked -- and five surviving "digital twin" lines were found there, long
  # after release_notes_v2.6.1.md claimed the wording had been replaced
  # "throughout". The scan now also covers the user-facing documents
  # (iddia_lint.USER_FACING_DOC_TARGETS), so the trigger list below must
  # include them too, otherwise a docs-only commit skips the hook.
  #
  # It always scans the whole target set (pass_filenames: false) because the
  # registry is global; it is fast because it is a line scan.
  #
  # THIS FILE IS NOT A GATE ON ITS OWN (P10B4-01, measured 2026-08-27).
  # A pre-commit config only runs after somebody has run `pre-commit install`
  # in their clone. On this machine that had never happened: `.git/hooks/`
  # contained a single hook (commit-msg) and no pre-commit hook at all, so the
  # claim lint had been protecting nothing since the day it was written. A
  # config file that looks like protection but never runs is worse than no
  # config, because it stops people from asking where the gate is.
  #
  # The gate therefore does not depend on this file any more. It lives in the
  # test suite, which the release gate runs:
  #     tests/test_z5s_kampanya_araclari.py::TestIddiaLintKapisi
  # runs `python3 tools/iddia_lint.py --check` as a SUBPROCESS and asserts the
  # exit code, i.e. exactly what a hook would do. The hook below stays because
  # catching a claim before the commit is still cheaper than catching it in
  # CI -- but it is now a convenience, not the guarantee.
  #
  # ÖH D28 / altyapi (defter OH-D27-04, 8 Sep 2026): "it lives in the test
  # suite" was still only an INDIRECT binding, and it was measured to be thin
  # -- the tool's name appeared 0 times under .github/ and 0 times under
  # packaging/. The tool now also runs DIRECTLY, by name, in three places:
  #     packaging/release_gate.sh  step 10/10  (fail-closed, unskippable)
  #     .github/workflows/tests.yml           (step "İddia dili kapısı")
  #     .github/workflows/release.yml         (same step, `testler` job)
  # Those three are the guarantee; this file and the suite test remain the
  # cheap early warnings.
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      - id: iddia-lint
        name: iddia dili ve standart atifi denetimi
        entry: python3 tools/iddia_lint.py
        language: system
        pass_filenames: false
        files: '^(hrma/|tools/iddia_lint|docs/STANDART_ATIFLARI\.md|README\.md|INSTALL\.md|CONTRIBUTING\.md|docs/README\.md|docs/USER_MANUAL\.md|docs/RELEASE\.md|docs/user_guide/|packaging/)'
