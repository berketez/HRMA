name = "lean-lab"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanLab"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # kişisel proje: telif başlığı zorunlu değil
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "LeanLab"
