[pytest]
# 2026-08-03 — NEDEN BU DOSYA VAR
#
# Depoda hiç pytest yapılandırması yoktu. Argümansız `pytest` (yayın kapısının
# 5/7 adımı tam olarak bunu yapıyor) depo KÖKÜNDEN toplamaya başlıyor ve
# `packaging/mac/build.noindex/HRMA.app/Contents/Resources/libs/` içine
# giriyordu — yani PAKETLENMİŞ uygulamanın kendi kütüphanelerine. Orada
# pandas, scipy, sympy, aiohttp ve CPython'un kendi `test/` paketinin
# conftest'leri var.
#
# Ölçülen iki sonuç (3 Ağustos 2026):
#   1. Kapının 5/7 adımı HÜKÜM VERMEDEN öldü: pytest günlüğü 0 bayt kaldı,
#      betik çıkış 0 verdi, "KAPI AÇIK/KAPALI" satırı hiç basılmadı.
#   2. Toplama sırasında yazılan 2724 `__pycache__` dizini İMZALI bundle'ın
#      mührünü bozdu: `codesign --verify` "a sealed resource is missing or
#      invalid" demeye başladı ve yayın kapısı .app'i imzasız saydı.
#
# Yani testler, yayınlanacak ikilinin içine yazıp onu geçersiz kılıyordu.
testpaths = tests

# Toplama hiçbir koşulda bu dizinlere inmemeli. `packaging` derleme çıktısı
# ve gömülü runtime taşır; `build.noindex`/`payload`/`libs` adları paket
# içindeki üçüncü parti ağaçlardır.
norecursedirs =
    packaging
    build.noindex
    payload
    libs
    dist
    .git
    __pycache__
    node_modules

# ÖH D24 / OH-D23-23 — CI İŞ BÖLÜMÜ İŞARETİ.
#
# ``agir_canli_uc``: ürünün 66 ölçülebilir POST ucunun HEPSİNİ canlı
# ``test_client`` ile çağırıp 200 bekleyen katalog kapısı (P10B4-16,
# tests/test_d23_altyapi_a1.py::TestTabanYuklerCanli).
#
# ÖLÇÜLDÜ (5 Eylül 2026, yerel; kanıt
# docs/scofield/raw/OH/D24/altyapi/a2/once_ohd2323.json):
#   tests/test_d23_altyapi_a1.py tamamı            253,64 s (84 test)
#   aynı dosya, -m 'not agir_canli_uc'               2,54 s (18 test,
#                                                    66 seçilmedi)
#   kapının kendi maliyeti                         251,10 s  (%99,0)
# Yani bu tek kapı, dosyanın süresinin tamamına yakınıdır ve her push/PR
# koşumuna ~4 dakika 11 saniye ekler.
#
# Karar: kapı KALDIRILMADI, TAŞINDI. Push/PR koşumu bu işareti SEÇMEYLE
# dışarıda bırakır (``-m 'not agir_canli_uc'``) — ATLAMA değil seçme, yani
# atlama bütçesi kapısı (tests.yml) etkilenmez: seçilmeyen test junit
# raporuna hiç girmez, atlanan test 'skipped' olarak girip bütçeyi
# patlatırdı. İşaretli testler
#   * tests.yml'nin gecelik (cron '17 3 * * *') ve elle koşumunda,
#   * release.yml'nin tam süit adımında (yayın kapısı)
# koşar. Bir bekçi (tests/test_d24_altyapi_a2.py::TestOHD2323CiIsBolumu)
# bu iki yolun varlığını ŞART koşar: kapı sessizce düşerse kırmızı olur.
markers =
    agir_canli_uc: canlı uç kataloğu kapısı — push/PR'da seçilmez, gecelik ve yayın koşumunda koşar
    kabul_ui: V301 yayın kapısının yerel tarayıcı (Playwright + Mac Chromium) düğümleri — atlanmaz; Linux CI'da SEÇİLMEZ (tests.yml -m "not kabul_ui"), packaging/release_gate.sh 5/10 yerelde koşar
